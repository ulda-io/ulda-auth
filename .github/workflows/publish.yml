name: Publish to npm

on:
  push:
    tags: ['v*.*.*']
  # Manual runs check and upload the archive, but never publish it.
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'ulda-io/ulda-auth'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  package:
    name: Prepare verified archive
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.artifact.outputs.filename }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      version: ${{ steps.artifact.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const accepted = JSON.parse(readFileSync('.github/npm-release.json', 'utf8'));
          assert.equal(pkg.name, 'ulda-auth');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.notEqual(pkg.private, true);
          assert.equal(pkg.repository.url, 'git+https://github.com/ulda-io/ulda-auth.git');
          assert.deepEqual(pkg.publishConfig, { registry: 'https://registry.npmjs.org/', access: 'public', tag: 'latest' });
          for (const record of [lock, lock.packages[''], accepted]) {
            assert.equal(record.name, pkg.name);
            assert.equal(record.version, pkg.version);
          }
          assert.equal(accepted.filename, `${pkg.name}-${pkg.version}.tgz`);
          assert.match(accepted.sha256, /^[a-f0-9]{64}$/);
          if (process.env.GITHUB_EVENT_NAME === 'push') {
            assert.equal(process.env.GITHUB_REF_TYPE, 'tag');
            assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          } else {
            assert.equal(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch');
            assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          }
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Build and test the archive in a clean consumer
        run: npm run test:package
      - name: Check publish metadata without publishing
        run: npm run test:publish
      - name: Match the accepted archive
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const accepted = JSON.parse(readFileSync('.github/npm-release.json', 'utf8'));
          const checked = JSON.parse(readFileSync('.local/release/publish-check.json', 'utf8'));
          const bytes = readFileSync(`.local/release/${accepted.filename}`);
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const integrity = 'sha512-' + createHash('sha512').update(bytes).digest('base64');
          assert.equal(sha256, accepted.sha256, 'Archive differs from the accepted release');
          for (const key of ['name', 'version', 'filename', 'sha256']) assert.equal(checked[key], accepted[key]);
          assert.equal(checked.integrity, integrity);
          assert.equal(checked.dryRun, true);
          assert.equal(checked.published, false);
          for (const [key, value] of Object.entries({ filename: accepted.filename, version: accepted.version, sha256, integrity }))
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Verified ${accepted.name}@${accepted.version}\n\nSHA-256: \`${sha256}\`\n\nManual runs do not publish.\n`);
          NODE
      - name: Upload the checked archive and safe receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: |
            .local/release/${{ steps.artifact.outputs.filename }}
            .local/release/package-check.json
            .local/release/publish-check.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish verified archive with OIDC
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # No checkout, dependency installation or package scripts in this job.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [a,b,c] = process.argv[1].split(".").map(Number); if (!(a > 11 || a === 11 && (b > 5 || b === 5 && c >= 1))) process.exit(1)' "$(npm --version)"
      - name: Download the checked archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/ulda-publish
      - name: Verify and publish the exact archive
        shell: bash
        env:
          RELEASE_FILE: ${{ needs.package.outputs.filename }}
          RELEASE_SHA256: ${{ needs.package.outputs.sha256 }}
          RELEASE_INTEGRITY: ${{ needs.package.outputs.integrity }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ulda-publish"
          printf '%s  %s\n' "$RELEASE_SHA256" "$RELEASE_FILE" | sha256sum --check --strict
          npm publish "$RELEASE_FILE" --ignore-scripts --access public --tag latest --provenance --registry=https://registry.npmjs.org/
          for attempt in 1 2 3 4 5; do
            if published_integrity="$(npm view "ulda-auth@$RELEASE_VERSION" dist.integrity --registry=https://registry.npmjs.org/)" && [ "$published_integrity" = "$RELEASE_INTEGRITY" ]; then
              printf 'Published ulda-auth@%s; registry integrity matches the checked archive.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'Registry integrity not confirmed. Inspect the published version before retrying; do not republish blindly.' >&2
          exit 1
